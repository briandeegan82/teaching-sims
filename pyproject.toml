[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-sims"
version = "0.2.0"
description = "Interactive Dear PyGui radar teaching simulations (arrays through SAR)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teaching Sims" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "dearpygui>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
teaching-sims = "teaching_sims.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
